<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>[APP NAME] — scheduled maintenance</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --muted: #475569; --accent: #0f766e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --fg: #f1f5f9; --muted: #94a3b8; --accent: #2dd4bf; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 34rem; padding: 2rem 1.25rem; }
    h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 1rem; }
    p { color: var(--muted); margin: 0 0 1rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>[APP NAME] is down for scheduled maintenance</h1>
    <p>We're moving [APP NAME] to new infrastructure. It will be back by <strong>[END TIME, TIMEZONE]</strong>. Your data is safe, and the address stays the same.</p>
    <p>Next update: [TIME, TIMEZONE] at <a href="[STATUS URL]">[STATUS URL]</a>.</p>
    <p>Need help? <a href="mailto:[SUPPORT EMAIL]">[SUPPORT EMAIL]</a></p>
  </main>
</body>
</html>
